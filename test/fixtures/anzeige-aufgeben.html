<!doctype html>
<!-- Nachbau des Formulars „Anzeige aufgeben“ (Stand 10/2026) für Tests: nur Titel und Beschreibung,
     Feldnamen wie auf der echten Seite (p-anzeige-aufgeben-schritt2.html). -->
<html lang="de"><head><meta charset="utf-8"><title>Anzeige aufgeben | kleinanzeigen.de</title>
<style>body{font-family:Arial,sans-serif;background:#f4f4f0;margin:0} main{max-width:760px;margin:20px auto;background:#fff;padding:20px}
label{display:block;font-weight:700;margin:16px 0 4px} input,textarea{width:100%;box-sizing:border-box;padding:8px;font:inherit}</style></head>
<body><main><h1>Anzeige aufgeben</h1><form>
<label for="ad-title">Titel</label><input id="ad-title" maxlength="65" name="title" value="Winterreifen 205/55 R16">
<label for="ad-description">Beschreibung</label>
<textarea id="ad-description" maxlength="4000" name="description" rows="5">4 Winterreifen auf Stahlfelgen, 6 mm Profil.</textarea>
<div id="ad-description-character-count">44/4000</div>
</form></main></body></html>
